[project]
name = "auto-context-cli"
version = "1.5.1"
description = "Autonomous context & instruction manager for AI coding assistants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arghya Biswas", email = "" }]
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
init-context = "auto_context.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_context"]

# Explicitly include all template data files so they are bundled in the wheel.
# Hatchling includes non-.py files automatically when they live inside a package
# directory, but being explicit guards against future .gitignore or exclude rules.
[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build]
include = [
    "src/auto_context/**/*.py",
    "src/auto_context/templates/**/*.md",
    "src/auto_context/templates/**/*.json",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
